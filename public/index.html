<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>AI Translator Perbualan</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --line: #334155; --text: #e2e8f0; --muted: #94a3b8;
    --a: #38bdf8; --b: #f472b6; --mine: #334155; --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }

  .panel { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  .panel.a { --accent: var(--a); }
  .panel.b { --accent: var(--b); }
  body.facing .panel.a { transform: rotate(180deg); }

  .head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .who { font-weight: 700; color: var(--accent); }
  select { margin-left: auto; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 8px; font-size: 15px; max-width: 60%; }

  .log { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; line-height: 1.35; font-size: 18px; word-wrap: break-word; }
  .msg.mine { align-self: flex-end; background: var(--mine); border-bottom-right-radius: 4px; }
  .msg.theirs { align-self: flex-start; background: color-mix(in srgb, var(--accent) 22%, var(--panel));
    border-bottom-left-radius: 4px; font-size: 21px; }
  .msg small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .msg.pending { opacity: .6; font-style: italic; }
  .msg.error { background: color-mix(in srgb, var(--danger) 30%, var(--panel)); }
  .empty { color: var(--muted); text-align: center; margin: auto; font-size: 15px; padding: 0 20px; }

  .bar { display: flex; gap: 8px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  .bar input { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 10px 14px; font-size: 16px; }
  button { cursor: pointer; border: 0; border-radius: 999px; font-size: 16px; color: #0f172a; }
  .send { background: var(--line); color: var(--text); padding: 0 14px; }
  .mic { width: 52px; height: 52px; flex: none; background: var(--accent); display: grid; place-items: center; }
  .mic svg { width: 24px; height: 24px; }
  .mic.on { background: var(--danger); color: #fff; animation: pulse 1.2s infinite; }
  .mic:disabled { opacity: .35; cursor: not-allowed; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgb(239 68 68 / .6); } 50% { box-shadow: 0 0 0 10px rgb(239 68 68 / 0); } }

  .middle { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 6px; background: var(--bg);
    border-block: 1px solid var(--line); flex-wrap: wrap; }
  .middle button { background: var(--line); color: var(--text); padding: 6px 12px; font-size: 13px; }
  .middle button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .status:empty { display: none; }
  .status { font-size: 12px; color: var(--muted); width: 100%; text-align: center; min-height: 1em; }
</style>
</head>
<body class="facing">

<section class="panel a" data-side="a">
  <div class="head"><span class="who">Orang A</span><select aria-label="Bahasa Orang A"></select></div>
  <div class="log"></div>
  <form class="bar">
    <input placeholder="Taip atau tekan mikrofon…" autocomplete="off">
    <button type="submit" class="send">Hantar</button>
    <button type="button" class="mic" aria-label="Cakap"></button>
  </form>
</section>

<div class="middle">
  <button id="facing" aria-pressed="true">↕ Mod berhadapan</button>
  <button id="voice" aria-pressed="true">🔊 Suara</button>
  <button id="clear">🗑 Padam</button>
  <div class="status" id="status"></div>
</div>

<section class="panel b" data-side="b">
  <div class="head"><span class="who">Orang B</span><select aria-label="Bahasa Orang B"></select></div>
  <div class="log"></div>
  <form class="bar">
    <input placeholder="Taip atau tekan mikrofon…" autocomplete="off">
    <button type="submit" class="send">Hantar</button>
    <button type="button" class="mic" aria-label="Cakap"></button>
  </form>
</section>

<script>
const LANGS = [
  ["ms-MY", "Bahasa Melayu"], ["en-US", "English"], ["zh-CN", "中文 (Mandarin)"], ["ta-IN", "தமிழ் (Tamil)"],
  ["id-ID", "Bahasa Indonesia"], ["ar-SA", "العربية (Arab)"], ["th-TH", "ไทย (Thai)"], ["vi-VN", "Tiếng Việt"],
  ["ja-JP", "日本語 (Jepun)"], ["ko-KR", "한국어 (Korea)"], ["hi-IN", "हिन्दी (Hindi)"], ["bn-BD", "বাংলা (Bengali)"],
  ["tl-PH", "Filipino"], ["fr-FR", "Français"], ["es-ES", "Español"], ["de-DE", "Deutsch"],
  ["ru-RU", "Русский"], ["pt-BR", "Português"], ["it-IT", "Italiano"], ["tr-TR", "Türkçe"],
];
const MIC_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>';

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const state = { history: [], voice: store.get("voice", true) };
const sides = {};
for (const el of document.querySelectorAll(".panel")) {
  const side = el.dataset.side;
  const select = el.querySelector("select");
  select.innerHTML = LANGS.map(([c, n]) => `<option value="${c}">${n}</option>`).join("");
  select.value = store.get("lang-" + side, side === "a" ? "ms-MY" : "en-US");
  select.onchange = () => store.set("lang-" + side, select.value);
  sides[side] = { el, select, log: el.querySelector(".log"), input: el.querySelector("input"),
    mic: el.querySelector(".mic"), form: el.querySelector("form") };
  sides[side].mic.innerHTML = MIC_SVG;
}
const other = (s) => (s === "a" ? "b" : "a");
const langName = (code) => (LANGS.find(([c]) => c === code) || [code, code])[1];
const statusEl = document.getElementById("status");
const setStatus = (t) => (statusEl.textContent = t || "");

function renderEmpty() {
  for (const s of Object.values(sides)) {
    if (!s.log.children.length) s.log.innerHTML = '<p class="empty">Tekan mikrofon dan mula bercakap. Terjemahan akan muncul di skrin orang di hadapan anda.</p>';
  }
}
function addBubble(side, cls, text, note) {
  const log = sides[side].log;
  log.querySelector(".empty")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  if (note) { const s = document.createElement("small"); s.textContent = note; div.appendChild(s); }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function handleUtterance(speaker, text) {
  text = text.trim();
  if (!text) return;
  const listener = other(speaker);
  const from = sides[speaker].select.value, to = sides[listener].select.value;

  addBubble(speaker, "mine", text);
  const pending = addBubble(listener, "theirs pending", "Menterjemah…");
  const mineOut = sides[speaker].log.lastElementChild;

  try {
    const res = await fetch("/api/translate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, from: langName(from), to: langName(to), history: state.history }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Ralat " + res.status);

    pending.className = "msg theirs";
    pending.textContent = data.translation;
    const orig = document.createElement("small"); orig.textContent = text; pending.appendChild(orig);
    const tr = document.createElement("small"); tr.textContent = "→ " + data.translation; mineOut.appendChild(tr);

    state.history.push({ speaker: speaker === "a" ? "Person A" : "Person B", text });
    speak(data.translation, to);
  } catch (e) {
    pending.className = "msg theirs error";
    pending.textContent = "⚠ " + e.message;
  }
}

function speak(text, lang) {
  if (!state.voice || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  const v = speechSynthesis.getVoices().find((v) => v.lang.replace("_", "-").startsWith(lang.split("-")[0]));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

// ---- Pengecaman suara ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let active = null; // { side, rec }

function stopListening() { if (active) active.rec.stop(); }

function startListening(side) {
  if (active) { const was = active.side; stopListening(); if (was === side) return; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  const s = sides[side];
  const rec = new SR();
  rec.lang = s.select.value;
  rec.interimResults = true;
  rec.continuous = false;
  let finalText = "";
  rec.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    s.input.value = finalText + interim;
  };
  rec.onerror = (ev) => {
    if (ev.error === "not-allowed") setStatus("Akses mikrofon ditolak. Benarkan mikrofon dalam pelayar.");
    else if (ev.error !== "no-speech" && ev.error !== "aborted") setStatus("Ralat mikrofon: " + ev.error);
  };
  rec.onend = () => {
    s.mic.classList.remove("on");
    active = null;
    setStatus("");
    const t = (finalText || s.input.value).trim();
    s.input.value = "";
    if (t) handleUtterance(side, t);
  };
  active = { side, rec };
  s.mic.classList.add("on");
  setStatus(`Mendengar ${langName(rec.lang)}…`);
  rec.start();
}

for (const [side, s] of Object.entries(sides)) {
  if (!SR) { s.mic.disabled = true; s.mic.title = "Pelayar ini tidak menyokong pengecaman suara (cuba Chrome)"; }
  s.mic.onclick = () => startListening(side);
  s.form.onsubmit = (e) => { e.preventDefault(); const t = s.input.value; s.input.value = ""; handleUtterance(side, t); };
}
if (!SR) setStatus("Pengecaman suara tidak disokong di pelayar ini — guna Chrome/Edge/Safari, atau taip.");

// ---- Kawalan ----
const facingBtn = document.getElementById("facing");
const setFacing = (on) => { document.body.classList.toggle("facing", on); facingBtn.setAttribute("aria-pressed", on); store.set("facing", on); };
setFacing(store.get("facing", true));
facingBtn.onclick = () => setFacing(!document.body.classList.contains("facing"));

const voiceBtn = document.getElementById("voice");
const setVoice = (on) => { state.voice = on; voiceBtn.setAttribute("aria-pressed", on); store.set("voice", on); if (!on && "speechSynthesis" in window) speechSynthesis.cancel(); };
setVoice(state.voice);
voiceBtn.onclick = () => setVoice(!state.voice);

document.getElementById("clear").onclick = () => {
  state.history = [];
  for (const s of Object.values(sides)) s.log.innerHTML = "";
  renderEmpty();
};
if ("speechSynthesis" in window) speechSynthesis.getVoices();
renderEmpty();
</script>
</body>
</html>
